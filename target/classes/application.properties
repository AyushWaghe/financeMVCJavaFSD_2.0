server.port=8082
spring.main.banner-mode=off

#DB settings
spring.datasource.url=jdbc:postgresql://localhost:5433/JavaFSDFinanceMVC_2.0
spring.datasource.username=postgres
spring.datasource.password=#Zlrx4321
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update  
#The above property ensures that if we dont have a table then hibernate will create one
spring.jpa.show-sql=false
#If you want to see what query is being fired then the above line is needed

spring.kafka.bootstrap-servers=localhost:9092,localhost:9094,localhost:9095 

#Producer configuration---------------------------------------------------------------------------------------------------
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer


#Consumer configuration------------------------------------------------------------------------------------------------------

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*


